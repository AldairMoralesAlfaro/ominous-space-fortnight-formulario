<!Doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Bootstrap demo</title>
  </head>
    <style>

    </style>
  <body >
    <div class="container mt-5 ">
      <div class="card text-left">
        <div class="card-header">
          <h3>Payment for example</h3>
        </div>
        <div class="alert alert-danger" role="alert">
          some fields are missing
        </div>

        <div class="d-flex card-header" style="background-color: #ffff;"> 
          <fieldset class="col-5 mb-3 me-4">
            <label for="exampleFormControlInput1" class="form-label font-weight-bold"><strong>card</strong></label>
            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="xxxxxxxxxxxxxxxx">
          </fieldset>
          <fieldset class="col-2 mb-3 me-4">
            <label for="exampleFormControlInput1" class="form-label"><strong>cvc#</strong></label>
            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="account">
          </fieldset>
          <fieldset class="col-3 mb-3 me-4">
            <label for="exampleFormControlInput1" class="form-label"><strong>Amount</strong></label>
            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="">
          </fieldset>
        </div>

        <div class="d-flex flex-direction-column card-header" style="background-color: #ffff;">
            <div class="col mb-3 me-4">
              <fieldset class="col mb-4 me-8">
                <label for="exampleFormControlInput1" class="form-label"><strong>First Name</strong></label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="">
              </fieldset>
                <fieldset class="col mb-0 me-8 m">
                  <label for="exampleFormControlInput1" class="form-label"><strong>City</strong></label>
                  <input type="city" class="form-control" id="exampleFormControlInput1" placeholder="">
                </fieldset>
              <fieldset class="col-7 mb-4 me-5">
                  <p style="line-height: 30px; margin-top: 4px;"><strong>We accept</strong></p>
                    <div class="col-8" style="border-radius: 5px; padding: 7px; background-color:rgba(84, 81, 81, 0.725);" >
                      <label for="master" style="font: 1em sans-serif; margin-top: 3px; ">
                          <input type="radio" name="paymethod" value="master" style="margin-left: 13px;">
                          <i class="fa-brands fa-cc-mastercard " style="color: #ffff;"></i>
                        </label>
                        <label for="visa" style="font: 1em sans-serif; margin-left: 13px;">
                          <input type="radio" name="paymethod" value="visa" >
                          <i class="fa-brands fa-cc-visa" style="color: #ffff;"></i>
                        </label>
                        <label for="diners" style="font: 1em sans-serif; margin-left: 13px;" >
                          <input type="radio" name="paymethod" value="diners">
                          <i class="fa-brands fa-cc-diners-club" style="color: #ffff;"></i>
                        </label>
                        <label for="amex" style="font: 1em sans-serif; margin-left: 13px;">
                          <input type="radio" name="paymethod" value="amex">
                          <i class="fa-brands fa-cc-amex" style="color: #ffff;"></i>
                        </label>
                    </div>
              </fieldset>
             </div>


            <div class="col mb-3 me-4">
                <fieldset class="col mb-4 me-7">
                  <label for="exampleFormControlInput1" class="form-label"><strong>Last Name</strong></label>
                  <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="">
                </fieldset>
              
              <div  class="d-flex">
                <fieldset class="col mb-4 me-4">
                    <label for="exampleFormControlInput1" class="form-label"><strong>State</strong></label>
                      <select class="form-select" aria-label="Default select example">
                        <option selected>Pick a state</option>
                        <option value="1">One</option>
                        <option value="2">Two</option>
                        <option value="3">Three</option>
                      </select>
                </fieldset>
                  <fieldset class="col mb-4 me-6">
                    <label for="exampleFormControlInput1" class="form-label"><strong>Postal Code</strong></label>
                    <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="">
                </fieldset>
              </div>
                <strong><p>Message</p></strong>
                <fieldset class="col-12 mb-4 me-6">
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>
                    <label for="floatingTextarea2"></label>
                  </div>
                  <p>Add any note here. </p>
                </fieldset>
            </div>

        </div>





        <div class="d-flex card-footer" style="background-color: rgb(245, 240, 240); justify-content: end;" >
          <a href="#" class="btn btn-secondary" style="margin-right: 15px;">Cacel</a>
          <a href="#" class="btn btn-primary" style="margin-right: 15px;">Send</a>
        </div>

      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  </body>
</html>
